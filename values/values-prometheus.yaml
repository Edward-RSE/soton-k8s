grafana:
  adminUser: admin
  adminPassword: ""
  ingress:
    enabled: true
    hosts:
      - grafana.sotongpt.soton.ac.uk
    path: /
    pathType: Prefix
    ingressClassName: traefik
    tls:
        - secretName: srv04885-tls
          hosts:
            - grafana.sotongpt.soton.ac.uk
  service:
    type: ClusterIP
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
prometheus:
  prometheusSpec:
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelectorNilUsesHelmValues: false
alertmanager:
  enabled: true
